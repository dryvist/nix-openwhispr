---
# Copy of the canonical .markdownlint-cli2.yaml from the organization's shared
# .github repository, plus repo-specific ignores. Refresh it from that
# repository's default branch.

config:
  MD013:
    line_length: 160
    tables: true
    strict: true
    # `heading_line_length` and `code_block_line_length` deliberately not set.
    # An 80-character ceiling is an anti-pattern for modern displays.

ignores:
  - "CHANGELOG.md"
  - ".git/**"
