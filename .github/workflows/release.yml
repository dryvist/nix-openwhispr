name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  source:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            test "$GITHUB_REF" = refs/heads/main
          else
            git fetch origin main --depth=1
            git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"
          fi
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            version="$INPUT_VERSION"
          else
            version="${REF_NAME#v}"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          test "$(jq -r .upstreamVersion release.json)" = "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: source
    strategy:
      matrix:
        include:
          - system: aarch64-darwin
            runner: [self-hosted, openwhispr-macos, arm64]
            artifact: openwhispr-aarch64-darwin
          - system: x86_64-darwin
            runner: macos-15-intel
            artifact: openwhispr-x86_64-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            extra-experimental-features = nix-command flakes
      - name: Build package
        run: nix build ".#packages.${{ matrix.system }}.default" --no-link --print-out-paths > package-path
      - name: Copy application bundle
        run: |
          mkdir -p dist
          ditto "$(cat package-path)/Applications/OpenWhispr.app" dist/OpenWhispr.app
      - name: Archive and checksum
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/OpenWhispr.app "${{ matrix.artifact }}.zip"
          shasum -a 256 "${{ matrix.artifact }}.zip" > "${{ matrix.artifact }}.zip.sha256"
      - name: Verify bundle metadata
        run: |
          test -x dist/OpenWhispr.app/Contents/MacOS/OpenWhispr
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' dist/OpenWhispr.app/Contents/Info.plist
          codesign --verify --deep --strict dist/OpenWhispr.app
          spctl --assess --type execute dist/OpenWhispr.app
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.zip.sha256

  publish:
    needs: [source, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/*.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.source.outputs.version }}
        run: gh release create "v$VERSION" dist/* --generate-notes --verify-tag
