name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            extra-experimental-features = nix-command flakes
      - name: Check forbidden publication content
        run: nix develop --command ./scripts/check-publication.sh
      - name: Check flake
        run: nix flake check --all-systems --no-build
      - name: Check lock file
        run: nix flake lock --no-update-lock-file
      - name: Validate upstream release pin
        run: |
          jq -e '.upstreamTag | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")' release.json
          jq -e '.upstreamRevision | test("^[0-9a-f]{40}$")' release.json
          jq -e '.upstreamReleasedAt | fromdateiso8601 > 0' release.json
      - name: Check formatting
        run: nix fmt -- --fail-on-change
      - name: Evaluate Darwin package
        run: nix eval --raw .#packages.aarch64-darwin.default.name
      - name: Validate pinned model manifest
        run: |
          jq -e '.schema == 1 and (.artifacts | length >= 8)' models.json
          test "$(jq -r '.artifacts[].sha256' models.json | grep -Ec '^[0-9a-f]{64}$')" -eq 8
          jq -e 'all(.artifacts[]; (.license | type) == "string" and length > 0)' models.json

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            extra-experimental-features = nix-command flakes
      - name: ShellCheck
        run: nix develop --command shellcheck scripts/*.sh
      - name: Static Nix checks
        run: |
          nix develop --command statix check .
          nix develop --command deadnix --fail

  darwin-build:
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            extra-experimental-features = nix-command flakes
      - name: Build Apple Silicon package
        run: nix build .#packages.aarch64-darwin.default --no-link --print-out-paths > package-path
      - name: Build pinned local models
        run: nix build .#packages.aarch64-darwin.models --no-link
      - name: Build Home Manager integration
        run: nix build .#checks.aarch64-darwin.module --no-link
      - name: Inspect application bundle
        run: |
          app="$(cat package-path)/Applications/OpenWhispr.app"
          test -x "$app/Contents/MacOS/OpenWhispr"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist"
          codesign --verify --deep --strict "$app"
          spctl --assess --type execute "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" openwhispr-ci.zip
          shasum -a 256 openwhispr-ci.zip > openwhispr-ci.zip.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: openwhispr-ci-aarch64-darwin
          path: openwhispr-ci.zip*

  actions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          persona: pedantic
          min-severity: medium

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
        with:
          languages: actions
      - uses: github/codeql-action/analyze@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
