name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            extra-experimental-features = nix-command flakes
      - name: Check forbidden publication content
        run: ./scripts/check-publication.sh
      - name: Check flake
        run: nix flake check --all-systems --no-build
      - name: Check formatting
        run: nix fmt -- --check
      - name: Evaluate Darwin package
        run: nix eval --raw .#packages.aarch64-darwin.default.name

  actions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: zizmorcore/zizmor-action@v0.2.0
        with:
          persona: pedantic
          min-severity: medium

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: actions
      - uses: github/codeql-action/analyze@v3

